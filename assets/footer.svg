<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.75" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .beam { animation: run 3.5s linear infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .dot:nth-of-type(2) { animation-delay: .4s; }
    .dot:nth-of-type(3) { animation-delay: .8s; }
    @keyframes run { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
  <rect x="0" y="39" width="1200" height="2" fill="url(#line)" opacity="0.6"/>
  <rect class="beam" x="0" y="38" width="300" height="4" fill="url(#beam)" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <rect class="dot" x="570" y="35" width="10" height="10" fill="#22d3ee" transform="rotate(45 575 40)"/>
    <rect class="dot" x="595" y="35" width="10" height="10" fill="#818cf8" transform="rotate(45 600 40)"/>
    <rect class="dot" x="620" y="35" width="10" height="10" fill="#c084fc" transform="rotate(45 625 40)"/>
  </g>
</svg>
