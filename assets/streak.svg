<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="GitHub streak: 1177 contributions, current streak 20 days, longest streak 58 days">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif }
    .num { font-size: 40px; font-weight: 700; fill: #fe428e }
    .lab { font-size: 18px; fill: #fe428e }
    .sub { font-size: 14px; fill: #a9fef7 }
    .cur { fill: #f8d847; font-weight: 700 }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .a { animation: pop .6s ease-out both }
    .a2 { animation: pop .6s ease-out .15s both }
    .a3 { animation: pop .6s ease-out .3s both }
  </style>
  <rect width="900" height="200" rx="8" fill="#141321"/>
  <line x1="300" y1="35" x2="300" y2="165" stroke="#a9fef7" stroke-opacity=".35"/>
  <line x1="600" y1="35" x2="600" y2="165" stroke="#a9fef7" stroke-opacity=".35"/>
  <g class="a" text-anchor="middle">
    <text class="num" x="150" y="92">1,177</text>
    <text class="lab" x="150" y="126">Total Contributions</text>
    <text class="sub" x="150" y="152">May 11, 2021 - Present</text>
  </g>
  <g class="a2" text-anchor="middle">
    <circle cx="450" cy="82" r="44" fill="none" stroke="#fe428e" stroke-width="6"/>
    <text class="num cur" x="450" y="96" style="font-size:36px">20</text>
    <path d="M450 22c6 8 10 11 10 18a10 10 0 0 1-20 0c0-4 2-6 4-9 1 3 3 5 5 5 0-6 0-9 1-14z" fill="#f8d847" transform="translate(0,-4)"/>
    <text class="lab cur" x="450" y="152">Current Streak</text>
    <text class="sub" x="450" y="176">Oct 19 - Nov 7</text>
  </g>
  <g class="a3" text-anchor="middle">
    <text class="num" x="750" y="92">58</text>
    <text class="lab" x="750" y="126">Longest Streak</text>
    <text class="sub" x="750" y="152">Sep 6, 2022 - Nov 2, 2022</text>
  </g>
</svg>
